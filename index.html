<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173c55">
  <meta name="robots" content="noindex,nofollow">
  <title>ปฏิทินบันทึกคำร้อง | ชนินทร์ โพธิ์ศรี</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#f5f8fa;font-family:system-ui,"Noto Sans Thai",sans-serif}
    iframe{display:block;width:100%;height:100%;border:0;background:#f5f8fa}
    #loading{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;background:#f5f8fa;color:#173c55;text-align:center;padding:24px;box-sizing:border-box}
    #loading[hidden]{display:none}
    .mark{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#173c55;color:white;font-size:23px;font-weight:900;box-shadow:0 8px 20px #173c5530}
    h1{font-size:18px;line-height:1.4;margin:0}p{font-size:13px;line-height:1.6;color:#617789;margin:0}
    a{color:#176b9d;font-size:13px;font-weight:700;text-decoration:none;border-bottom:1px solid currentColor}
    #direct{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:2;border:1px solid #d4e3eb;border-radius:999px;background:#fff;box-shadow:0 4px 16px #173c5520;padding:7px 11px;font-size:11px;color:#38596e;opacity:.84}
    #direct:focus-visible{outline:3px solid #4384c8}
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="mark">3</div>
    <h1>กำลังเปิดปฏิทินบันทึกคำร้อง</h1>
    <p>ใช้บัญชี Google เจ้าของระบบเพื่อเข้าใช้งาน</p>
    <a id="loadingLink" href="https://script.google.com/macros/s/AKfycby5QUQaYP31F5jEqRTvMsUT93sL6ZTVUxpeUpXsYE9l35xIdkldgyRGa2waGRU9q_oSdQ/exec">เปิดหน้าเว็บโดยตรง</a>
  </div>
  <iframe id="app" title="ปฏิทินบันทึกคำร้อง" referrerpolicy="no-referrer"></iframe>
  <a id="direct" href="https://script.google.com/macros/s/AKfycby5QUQaYP31F5jEqRTvMsUT93sL6ZTVUxpeUpXsYE9l35xIdkldgyRGa2waGRU9q_oSdQ/exec" target="_blank" rel="noopener noreferrer">เปิดหน้าเว็บโดยตรง ↗</a>
  <script>
    const frame=document.getElementById('app');
    frame.addEventListener('load',()=>{document.getElementById('loading').hidden=true;});
    frame.src='https://script.google.com/macros/s/AKfycby5QUQaYP31F5jEqRTvMsUT93sL6ZTVUxpeUpXsYE9l35xIdkldgyRGa2waGRU9q_oSdQ/exec';
  </script>
</body>
</html>
